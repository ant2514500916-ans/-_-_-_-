<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الأطلس التفاعلي للأمراض السريرية</title>
<style>
  :root {
    --bg: #f6f8fa;
    --surface: #ffffff;
    --surface-soft: #f0f4f8;
    --surface-hover: #e9eff6;
    --border: #dde4ec;
    --text: #182230;
    --text-muted: #5c6b7e;
    --accent: #0f766e;
    --accent-soft: rgba(15, 118, 110, 0.10);
    --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
    --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.07);
    --shadow-modal: 0 24px 60px rgba(15, 23, 42, 0.18);

    --c-cv: #d9485f;
    --c-resp: #0284c7;
    --c-gi: #c97a16;
    --c-gu: #0d9488;
    --c-msk: #7c5dfa;
    --c-neuro: #4f46e5;
    --c-hem: #c83e4d;
    --c-inf: #c94a86;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 84px;
    line-height: 1.6;
  }

  /* Top Airy Header */
  header {
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 20px 18px 18px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .header-top {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
  }

  h1 {
    font-size: 1.28rem;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.2px;
  }

  .subtitle {
    font-size: 0.86rem;
    color: var(--text-muted);
    margin-top: 3px;
  }

  .header-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .btn {
    padding: 9px 15px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    font-size: 0.84rem;
    font-weight: 600;
    transition: all 0.2s ease;
    box-shadow: var(--shadow-sm);
  }

  .btn:hover {
    background: var(--surface-soft);
    border-color: var(--accent);
    color: var(--accent);
  }

  .search-wrap {
    position: relative;
    width: 100%;
  }

  .search-box {
    width: 100%;
    padding: 12px 18px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--surface-soft);
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
    transition: all 0.2s ease;
  }

  .search-box:focus {
    background: var(--surface);
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }

  /* Main Spacious Container */
  .container {
    max-width: 1200px;
    margin: 26px auto 0;
    padding: 0 18px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  /* System Section */
  .system-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.25s ease, border-color 0.25s ease;
  }

  .system-card.open {
    box-shadow: var(--shadow-md);
  }

  .system-header {
    padding: 18px 22px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    user-select: none;
    background: linear-gradient(to left, color-mix(in srgb, var(--sys-color) 7%, #ffffff), #ffffff 65%);
    border-right: 6px solid var(--sys-color);
    transition: background 0.2s ease;
  }

  .system-header:hover {
    background: linear-gradient(to left, color-mix(in srgb, var(--sys-color) 11%, #ffffff), #f8fafc 70%);
  }

  .sys-name-ar {
    font-size: 1.1rem;
    font-weight: 800;
    color: var(--text);
  }

  .sys-name-en {
    font-size: 0.82rem;
    color: var(--text-muted);
    direction: ltr;
    display: inline-block;
    margin-top: 2px;
  }

  .sys-meta {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .count-pill {
    background: color-mix(in srgb, var(--sys-color) 12%, #ffffff);
    color: var(--sys-color);
    border: 1px solid color-mix(in srgb, var(--sys-color) 25%, transparent);
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 700;
  }

  .chevron {
    color: var(--text-muted);
    font-size: 0.85rem;
    transition: transform 0.25s ease;
  }

  .system-card.open .chevron {
    transform: rotate(180deg);
  }

  /* Diseases Grid */
  .diseases-list {
    display: none;
    padding: 20px 22px 24px;
    background: var(--bg);
    border-top: 1px solid var(--border);
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }

  .system-card.open .diseases-list {
    display: grid;
  }

  /* Disease Card */
  .disease-node {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-sm);
  }

  .disease-node:hover {
    border-color: color-mix(in srgb, var(--sys-color) 45%, var(--border));
    transform: translateY(-2px);
  }

  .disease-node.active {
    border-color: var(--sys-color);
    box-shadow: 0 8px 22px color-mix(in srgb, var(--sys-color) 14%, transparent);
  }

  .disease-btn {
    padding: 16px 18px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    text-align: right;
    background: transparent;
    border: none;
    color: var(--text);
    width: 100%;
  }

  .dis-ar {
    font-weight: 700;
    font-size: 1rem;
    color: var(--text);
    display: block;
  }

  .dis-en {
    font-size: 0.82rem;
    color: var(--sys-color);
    font-weight: 600;
    direction: ltr;
    display: inline-block;
    margin-top: 4px;
  }

  .dis-arrow {
    color: var(--text-muted);
    font-size: 0.85rem;
    transition: transform 0.2s ease, color 0.2s ease;
    flex-shrink: 0;
  }

  .disease-node.active .dis-arrow {
    transform: rotate(-90deg);
    color: var(--sys-color);
  }

  /* 4 Branch Buttons */
  .branch-options {
    display: none;
    border-top: 1px solid var(--border);
    background: var(--surface-soft);
    padding: 14px;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .disease-node.active .branch-options {
    display: grid;
    animation: gentleFade 0.2s ease;
  }

  .opt-btn {
    padding: 11px 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 0.84rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s ease;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }

  .opt-btn:hover {
    background: var(--sys-color);
    color: #ffffff;
    border-color: var(--sys-color);
    transform: translateY(-1px);
  }

  .opt-btn span.en-sub {
    font-size: 0.72rem;
    font-weight: 500;
    opacity: 0.8;
    direction: ltr;
  }

  /* Light Floating Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.36);
    backdrop-filter: blur(6px);
    z-index: 999;
    align-items: center;
    justify-content: center;
    padding: 18px;
  }

  .modal-overlay.show {
    display: flex;
    animation: gentleFade 0.2s ease;
  }

  .modal-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 22px;
    width: 100%;
    max-width: 640px;
    max-height: 86vh;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-modal);
    overflow: hidden;
  }

  .modal-header {
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 14px;
    background: var(--surface-soft);
  }

  .modal-cat-badge {
    display: inline-block;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 8px;
    color: #ffffff;
  }

  .modal-title-ar {
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--text);
  }

  .modal-title-en {
    font-size: 0.86rem;
    color: var(--text-muted);
    font-weight: 600;
    direction: ltr;
    display: inline-block;
    margin-top: 2px;
  }

  .close-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    width: 36px;
    height: 36px;
    border-radius: 12px;
    font-size: 1.05rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.18s ease;
  }

  .close-btn:hover {
    background: #fee2e2;
    border-color: #fca5a5;
    color: #b91c1c;
  }

  /* Language Switcher */
  .lang-bar {
    padding: 10px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
  }

  .lang-btn {
    flex: 1;
    padding: 8px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-soft);
    color: var(--text-muted);
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s ease;
  }

  .lang-btn.active {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }

  .modal-body {
    padding: 20px 24px;
    overflow-y: auto;
    line-height: 1.8;
    font-size: 0.96rem;
    color: var(--text);
    background: var(--surface);
  }

  .modal-body ul {
    padding-right: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .modal-body li {
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .modal-body li:last-child {
    border-bottom: none;
    padding-bottom: 0;
  }

  .ar-block {
    direction: rtl;
    text-align: right;
    color: var(--text);
    font-weight: 600;
  }

  .en-block {
    direction: ltr;
    text-align: left;
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-top: 6px;
    background: var(--surface-soft);
    padding: 8px 12px;
    border-radius: 10px;
  }

  .modal-footer {
    padding: 12px 18px;
    background: var(--surface-soft);
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .foot-tab {
    padding: 8px 6px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    transition: all 0.18s ease;
  }

  .foot-tab.current {
    background: var(--text);
    color: #ffffff;
    border-color: var(--text);
  }

  @keyframes gentleFade {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 640px) {
    .diseases-list { grid-template-columns: 1fr; padding: 14px; gap: 12px; }
    .modal-footer { grid-template-columns: repeat(2, 1fr); }
    header { padding: 16px 14px 14px; }
    .container { padding: 0 14px; margin-top: 18px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-top">
      <div>
        <h1>الأطلس التفاعلي للأمراض السريرية</h1>
        <div class="subtitle">مساحة قراءة هادئة ومريحة — اختر الجهاز ثم المرض لفتح النافذة العائمة</div>
      </div>
      <div class="header-actions">
        <button class="btn" onclick="toggleAllSystems(true)">فتح الكل</button>
        <button class="btn" onclick="toggleAllSystems(false)">طي الكل</button>
      </div>
    </div>
    <div class="search-wrap">
      <input type="text" id="searchInput" class="search-box" placeholder="ابحث باسم المرض بالعربي أو الإنكليزي أو بأي عرض أو تحليل..." oninput="filterData()">
    </div>
  </div>
</header>

<div class="container" id="app"></div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModalOnBg(event)">
  <div class="modal-card">
    <div class="modal-header">
      <div>
        <span class="modal-cat-badge" id="modalBadge">التصنيف</span>
        <div class="modal-title-ar" id="modalTitleAr">اسم المرض</div>
        <div class="modal-title-en" id="modalTitleEn">Disease Name</div>
      </div>
      <button class="close-btn" onclick="closeModal()" title="إغلاق">✕</button>
    </div>

    <div class="lang-bar">
      <button class="lang-btn active" id="btnLangBoth" onclick="setLangMode('both')">عربي + English</button>
      <button class="lang-btn" id="btnLangAr" onclick="setLangMode('ar')">عربي فقط</button>
      <button class="lang-btn" id="btnLangEn" onclick="setLangMode('en')">English Only</button>
    </div>

    <div class="modal-body" id="modalBody"></div>

    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<script>
const systemsData = [
  {
    id: "cv",
    nameAr: "أمراض القلب والأوعية الدموية",
    nameEn: "Cardiovascular System",
    color: "#f43f5e",
    diseases: [
      {
        ar: "ارتفاع ضغط الدم (فرط الضغط الشرياني)",
        en: "Hypertension (High Blood Pressure)",
        overview: [
          { ar: "ارتفاع مزمن ومستمر في قوة دفع الدم ضد جدران الشرايين (≥ 140/90 mmHg)، ويكون في أكثر من 90% من الحالات أساسياً (غير معروف السبب المباشر) ويُعرف بـ «القاتل الصامت».", en: "Chronic persistent elevation of systemic arterial blood pressure (≥ 140/90 mmHg); primary (essential) in >90% of cases and often called the 'silent killer'." },
          { ar: "يزيد بشكل كبير من خطر الإصابة بالجلطات القلبية والدماغية وقصور القلب والفشل الكلوي إذا لم يُعالج بانتظام.", en: "Significantly increases the risk of myocardial infarction, stroke, heart failure, and chronic kidney disease if untreated." }
        ],
        symptoms: [
          { ar: "غالباً ما يكون بدون أعراض واضحة في المراحل الاعتيادية ويُكتشف بالصدفة أثناء القياس.", en: "Usually asymptomatic in routine stages and discovered incidentally during blood pressure measurement." },
          { ar: "عند الارتفاع الملحوظ قد يسبب صداعاً في مؤخرة الرأس (خاصة صباحاً)، دوخة، طنين في الأذن، أو خفقاناً.", en: "When markedly elevated, may cause occipital morning headache, dizziness, tinnitus, or palpitations." }
        ],
        vitals: [
          { ar: "ضغط الدم (BP): مرتفع في قراءتين منفصلتين أو أكثر (≥ 140/90 mmHg).", en: "Blood Pressure (BP): Elevated on two or more separate readings (≥ 140/90 mmHg)." },
          { ar: "النبض والتنفس والحرارة: طبيعية تماماً في الظروف الاعتيادية.", en: "HR, RR & Temp: Completely normal in routine uncomplicated cases." }
        ],
        diagnosis: [
          { ar: "القياس السريري: قياس ضغط الدم بجهاز الزئبقي أو الإلكتروني المعاير بعد راحة 5 دقائق في جلستين مختلفتين.", en: "Clinical Measurement: Serial blood pressure readings taken after 5 minutes of rest on separate visits." },
          { ar: "فحوصات تقييم المضاعفات: تخطيط القلب (ECG)، إيكو القلب، وظائف الكلى (RFT)، تحليل البول، والدهون والسكر.", en: "Organ-Damage Workup: ECG, Echocardiography, Renal Function Tests (RFT), Urinalysis, Lipid Profile, and Fasting Glucose." }
        ]
      },
      {
        ar: "احتشاء العضلة القلبية (الجلطة القلبية)",
        en: "Myocardial Infarction (Heart Attack / MI)",
        overview: [
          { ar: "موت جزء من عضلة القلب نتيجة انسداد مفاجئ وكامل في أحد الشرايين التاجية المغذية للقلب بسبب خثرة دموية فوق تصلب الشرايين.", en: "Necrosis of a portion of the heart muscle caused by an acute, complete blockage of a coronary artery by a thrombus over an atherosclerotic plaque." },
          { ar: "حالة طبية طارئة تتطلب تدخلاً فورياً لإنقاذ عضلة القلب ومنع المضاعفات.", en: "A medical emergency requiring immediate reperfusion therapy to salvage myocardium." }
        ],
        symptoms: [
          { ar: "ألم ضاغط أو عاصر شديد وسط الصدر خلف عظم القص يستمر لأكثر من 20 دقيقة ولا يزول بالراحة.", en: "Severe crushing or squeezing retrosternal chest pain lasting >20 minutes and unrelieved by rest." },
          { ar: "انتشار الألم عادةً إلى الذراع اليسرى، الكتف، الرقبة، أو الفك السفلي.", en: "Pain commonly radiates to the left arm, shoulder, neck, or lower jaw." },
          { ar: "تعرق بارد غزير، غثيان وتقيؤ، وضيق في التنفس.", en: "Profuse cold sweating (diaphoresis), nausea, vomiting, and dyspnea." }
        ],
        vitals: [
          { ar: "النبض (HR): تسارع في ضربات القلب (Tachycardia) نتيجة الألم وتحفيز الجهاز الودي.", en: "Heart Rate (HR): Usually elevated (tachycardia) due to pain and sympathetic activation." },
          { ar: "ضغط الدم (BP): غالباً يرتفع في بداية النوبة، وقد ينخفض إذا تضررت مساحة واسعة من عضلة القلب.", en: "Blood Pressure (BP): Often elevated initially, or drops if extensive myocardial damage occurs." },
          { ar: "التنفس والأكسجة: تسارع خفيف في التنفس مع بقاء الأكسجة طبيعية أو انخفاضها بشكل طفيف.", en: "Respiration & SpO₂: Mild tachypnea with normal or mildly reduced SpO₂." }
        ],
        diagnosis: [
          { ar: "تحاليل الدم (Cardiac Biomarkers): ارتفاع إنزيم القلب النوعي (Troponin I / T) بشكل حاد، وارتفاع إنزيم CK-MB.", en: "Blood Tests: Marked elevation of cardiac-specific Troponin I/T and CK-MB." },
          { ar: "تخطيط القلب (ECG): ارتفاع قطعة ST (ST-elevation) أو انخفاضها مع انقلاب موجة T.", en: "ECG: ST-segment elevation or depression with T-wave inversion." },
          { ar: "التصوير: إيكو القلب (Echocardiography) وقسطرة الشرايين التاجية (Coronary Angiography).", en: "Imaging: Echocardiography and Coronary Angiography." }
        ]
      },
      {
        ar: "الذبحة الصدرية المستقرة",
        en: "Stable Angina",
        overview: [
          { ar: "نقص مؤقت في تروية عضلة القلب بالأكسجين نتيجة تضيق جزئي ثابت في الشرايين التاجية، يظهر عند زيادة الجهد دون موت خلايا القلب.", en: "Temporary myocardial ischemia caused by fixed partial narrowing of coronary arteries during exertion, without cell necrosis." },
          { ar: "تتميز بنمط متوقع؛ تظهر مع نفس مستوى المجهود وتزول سريعاً بالراحة.", en: "Predictable pattern: triggered by exertion or stress and relieved rapidly by rest." }
        ],
        symptoms: [
          { ar: "ثقل أو ضيق أو ألم عاصر خلف عظم القص يظهر مع المجهود البدني أو الانفعال النفسي.", en: "Retrosternal chest heaviness or tightness triggered by physical exertion or emotional stress." },
          { ar: "يستمر الألم (2–10 دقائق) ويزول تماماً بالراحة أو حبة تحت اللسان (Nitroglycerin).", en: "Lasts 2–10 minutes and resolves completely with rest or sublingual nitroglycerin." },
          { ar: "قد يمتد الألم بشكل خفيف إلى الذراع اليسرى أو الكتف دون تعرق غزير.", en: "May mildly radiate to the left arm or shoulder without profuse diaphoresis." }
        ],
        vitals: [
          { ar: "أثناء النوبة: ارتفاع مؤقت في معدل النبض (Tachycardia) وضغط الدم.", en: "During attack: Temporary rise in heart rate and blood pressure." },
          { ar: "بعد الراحة: تعود جميع العلامات الحيوية إلى مستواها الطبيعي تماماً.", en: "After rest: All vital signs return completely to normal baseline." }

          { ar: "تغير لون الجلد إلى الأزرق الداكن أو الأسود، برودة الطرف، فقدان الإحساس، وإفرازات كريهة الرائحة.", en: "Dusky blue or black skin discoloration, coldness, numbness, and foul-smelling discharge." }
        ],
        vitals: [
          { ar: "الحرارة والنبض: طبيعية في الغرغرينا الجافة؛ ترتفع الحرارة ويتسارع النبض في الغرغرينا الرطبة الملتهبة.", en: "Temp & HR: Normal in dry gangrene; fever and tachycardia in infected wet gangrene." }
        ],
        diagnosis: [
          { ar: "الفحوصات: سونار الدوبلر للشرايين (Arterial Doppler)، سكر الدم والتراكمي (HbA1c)، CBC، CRP، وزرع مسحة الجرح.", en: "Workup: Arterial Doppler Ultrasound, FBS & HbA1c, CBC, CRP, and wound swab culture." }
        ]
      },
      {
        ar: "الجفاف (نقص سوائل الجسم)",
        en: "Dehydration",
        overview: [
          { ar: "نقص في إجمالي الماء والأملاح داخل الجسم يحدث عندما تفوق السوائل المفقودة (الإسهال، القيء، التعرق، قلة الشرب) الكمية المتناولة.", en: "Depletion of total body water and electrolytes when fluid losses exceed intake." }
        ],
        symptoms: [
          { ar: "عطش شديد، جفاف الفم واللسان، قلة البول وتغير لونه للأصفر الداكن، ودوخة عند الوقوف.", en: "Intense thirst, dry mouth/tongue, dark concentrated oliguria, and postural dizziness." }
        ],
        vitals: [
          { ar: "النبض والضغط: تسارع خفيف إلى متوسط في النبض، وانخفاض الضغط (خاصة عند الوقوف) في الجفاف المتوسط والشديد.", en: "HR & BP: Mild-to-moderate tachycardia and orthostatic or supine hypotension in moderate/severe cases." }
        ],
        diagnosis: [
          { ar: "التحاليل: وظائف الكلى (ارتفاع نسبة BUN/Creatinine)، الشوارد (Na, K)، وتحليل البول (ارتفاع Specific Gravity).", en: "Labs: RFT (elevated BUN/Creatinine ratio), Serum Electrolytes, and Urinalysis (high Specific Gravity)." }
        ]
      }
    ]
  }
];


let currentModalState = { sysId: null, dIdx: null, tabKey: 'overview', lang: 'both' };

const tabMeta = {
  overview:  { ar: 'شرح عن المرض', en: 'Disease Overview', color: '#0f766e' },
  symptoms:  { ar: 'الأعراض الشائعة', en: 'Common Symptoms', color: '#d9485f' },
  vitals:    { ar: 'العلامات الحيوية', en: 'Vital Signs', color: '#0284c7' },
  diagnosis: { ar: 'التشخيص والتحاليل', en: 'Diagnosis & Labs', color: '#c97a16' }
};

function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';

  systemsData.forEach(sys => {
    const sysCard = document.createElement('div');
    sysCard.className = 'system-card open';
    sysCard.style.setProperty('--sys-color', sys.color);

    const diseasesHtml = sys.diseases.map((d, dIdx) => {
      const searchBlob = [
        d.ar, d.en,
        ...d.overview.map(x => x.ar + ' ' + x.en),
        ...d.symptoms.map(x => x.ar + ' ' + x.en),
        ...d.vitals.map(x => x.ar + ' ' + x.en),
        ...d.diagnosis.map(x => x.ar + ' ' + x.en)
      ].join(' ').toLowerCase();

      return `
        <div class="disease-node" id="dis-${sys.id}-${dIdx}" data-search="${searchBlob}">
          <button class="disease-btn" onclick="toggleDisease('${sys.id}-${dIdx}')">
            <div>
              <span class="dis-ar">${d.ar}</span>
              <span class="dis-en">${d.en}</span>
            </div>
            <span class="dis-arrow">◀</span>
          </button>
          <div class="branch-options">
            <button class="opt-btn" onclick="openModal('${sys.id}', ${dIdx}, 'overview')">
              <span>شرح عن المرض</span>
              <span class="en-sub">Overview</span>
            </button>
            <button class="opt-btn" onclick="openModal('${sys.id}', ${dIdx}, 'symptoms')">
              <span>الأعراض</span>
              <span class="en-sub">Symptoms</span>
            </button>
            <button class="opt-btn" onclick="openModal('${sys.id}', ${dIdx}, 'vitals')">
              <span>العلامات الحيوية</span>
              <span class="en-sub">Vital Signs</span>
            </button>
            <button class="opt-btn" onclick="openModal('${sys.id}', ${dIdx}, 'diagnosis')">
              <span>التشخيص والتحاليل</span>
              <span class="en-sub">Diagnosis & Labs</span>
            </button>
          </div>
        </div>
      `;
    }).join('');

    sysCard.innerHTML = `
      <div class="system-header" onclick="this.parentElement.classList.toggle('open')">
        <div>
          <div class="sys-name-ar">${sys.nameAr}</div>
          <div class="sys-name-en">${sys.nameEn}</div>
        </div>
        <div class="sys-meta">
          <span class="count-pill">${sys.diseases.length} أمراض</span>
          <span class="chevron">▼</span>
        </div>
      </div>
      <div class="diseases-list">
        ${diseasesHtml}
      </div>
    `;
    app.appendChild(sysCard);
  });
}

function toggleDisease(uid) {
  document.getElementById('dis-' + uid).classList.toggle('active');
}

function openModal(sysId, dIdx, tabKey) {
  currentModalState.sysId = sysId;
  currentModalState.dIdx = dIdx;
  currentModalState.tabKey = tabKey;
  renderModalContent();
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

function closeModalOnBg(e) {
  if (e.target.id === 'modalOverlay') closeModal();
}

function setLangMode(mode) {
  currentModalState.lang = mode;
  document.getElementById('btnLangBoth').classList.toggle('active', mode === 'both');
  document.getElementById('btnLangAr').classList.toggle('active', mode === 'ar');
  document.getElementById('btnLangEn').classList.toggle('active', mode === 'en');
  renderModalContent();
}

function renderModalContent() {
  const { sysId, dIdx, tabKey, lang } = currentModalState;
  const sys = systemsData.find(s => s.id === sysId);
  const disease = sys.diseases[dIdx];
  const meta = tabMeta[tabKey];

  const badge = document.getElementById('modalBadge');
  badge.textContent = `${meta.ar} • ${meta.en}`;
  badge.style.background = meta.color;

  document.getElementById('modalTitleAr').textContent = disease.ar;
  document.getElementById('modalTitleEn').textContent = disease.en;

  const items = disease[tabKey];
  const listHtml = items.map(item => {
    let html = '<li>';
    if (lang === 'both' || lang === 'ar') {
      html += `<div class="ar-block">${item.ar}</div>`;
    }
    if (lang === 'both' || lang === 'en') {
      html += `<div class="en-block">${item.en}</div>`;
    }
    html += '</li>';
    return html;
  }).join('');

  document.getElementById('modalBody').innerHTML = `<ul>${listHtml}</ul>`;

  const footer = document.getElementById('modalFooter');
  footer.innerHTML = Object.keys(tabMeta).map(k => `
    <button class="foot-tab ${k === tabKey ? 'current' : ''}" onclick="openModal('${sysId}', ${dIdx}, '${k}')">
      ${tabMeta[k].ar}
    </button>
  `).join('');
}

function toggleAllSystems(openState) {
  document.querySelectorAll('.system-card').forEach(card => {
    card.classList.toggle('open', openState);
  });
}

function filterData() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  document.querySelectorAll('.system-card').forEach(card => {
    let visibleCount = 0;
    card.querySelectorAll('.disease-node').forEach(node => {
      const match = !q || node.dataset.search.includes(q);
      node.style.display = match ? 'flex' : 'none';
      if (match) {
        visibleCount++;
        if (q) node.classList.add('active');
      } else {
        node.classList.remove('active');
      }
    });
    card.style.display = visibleCount > 0 ? 'block' : 'none';
    if (visibleCount > 0 && q) card.classList.add('open');
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

render();
</script>
</body>
</html>
